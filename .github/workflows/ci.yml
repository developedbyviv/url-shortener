name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Check syntax
        working-directory: backend
        run: node --check index.js

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build backend image
          uses: docker/build-push-action@v5
          with:
            context: ./backend
            target: production
            push: false
            tags: url-shortener-backend:test
            cache-from: type=gha
            cache-to: type=gha,mode=max
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: lint
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
            cache-dependency-path: backend/package-lock.json

        - name: Install dependencies
          working-directory: backend
          run: npm ci

        - name: Security audit
          working-directory: backend
          run: npm audit --audit-level=high


